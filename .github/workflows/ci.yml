name: CI
on:
  push:
    branches: ["**"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "expo-env.d.ts"
      - "app/**"
      - "src/**"
      - "tests/**"
      - "tools/nikl-importer/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "expo-env.d.ts"
      - "app/**"
      - "src/**"
      - "tests/**"
      - "tools/nikl-importer/**"
      - ".github/workflows/ci.yml"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: root-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm ci --prefix tools/nikl-importer --no-audit --no-fund
      - run: npm test --prefix tools/nikl-importer
