name: CI
on:
  push:
    branches: ["**"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "expo-env.d.ts"
      - "app/**"
      - "src/**"
      - "tests/**"
      - "tools/nikl-importer/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "expo-env.d.ts"
      - "app/**"
      - "src/**"
      - "tests/**"
      - "tools/nikl-importer/**"
      - ".github/workflows/ci.yml"
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: root-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit CI-generated root lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/lingomingle-foundation-2026-11-10'
        run: |
          cp package-lock.json "$RUNNER_TEMP/package-lock.generated.json"
          git fetch origin "$GITHUB_REF_NAME"
          if ! git diff --quiet HEAD "origin/$GITHUB_REF_NAME" -- package.json; then
            echo "package.json changed during this run; refusing to publish a stale lockfile."
            exit 1
          fi
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp "$RUNNER_TEMP/package-lock.generated.json" package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Root lockfile is already current."
          else
            git commit -m "build: commit CI-generated root npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm ci --prefix tools/nikl-importer --no-audit --no-fund
      - run: npm test --prefix tools/nikl-importer
